<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fwip</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" href="./assets/icon.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>
        <div class="top">
          <div class="header-nav-top">
            <div class="nav-top-all">
              <div class="nav-top overlay">
                <span class="material-symbols-rounded">left_panel_open</span>
              </div>
              <div class="nav-top overlay">
                <span class="material-symbols-rounded">refresh</span>
                <span class="material-symbols-rounded">search</span>
              </div>
            </div>
            <div class="header-top-info">
              <h1>Home</h1> 
              <p>All Feeds</p>
            </div>
          </div>
          <div class="filters">
            <div class="filter overlay"><p>Google</p></div>
            <div class="filter overlay"><p>Apple</p></div>
          </div>
        </div>

        <div class="feed">
          <p class="feed-name">All Posts</p>
          <div class="post overlay">
            <div class="source">
              <img src="./assets/post-source-temp.png" alt="Source Icon">
              <p class="source-name">The Verge</p>
            </div>
            <img class="post-image" src="./assets/post-img-temp.png" alt="Post Image">
            <h2 class="title">Title</h2>
            <p class="description">Description</p>
            <div class="author-time">
              <p class="author">author</p>
              <p class="time">0H</p>
            </div>
          </div>
        </div>
  </body>
  <script src="scripts/script.js"></script>
  <script src="scripts/reader.js"></script>
</html>
