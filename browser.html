<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Browser</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/browser.css">
    <link rel="icon" href="./assets/icon.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>
    <div class="browser-nav">
      <div class="nav-top overlay" id="browser-back">
        <span class="material-symbols-rounded">close</span>
      </div>
      <div class="nav-top overlay" id="browser-open-external">
        <span class="material-symbols-rounded">open_in_new</span>
      </div>
    </div>
    <div class="browser-content">
      <div class="browser-loading" id="browser-loading">
        <span class="material-symbols-rounded">progress_activity</span>
      </div>
      <iframe id="browser-iframe" title="Website" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>
  </body>
  <script src="scripts/script.js"></script>
  <script src="scripts/browser.js"></script>
</html>
