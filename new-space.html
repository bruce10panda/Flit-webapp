<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Space — Flit</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/new-space.css">
    <link rel="icon" href="./assets/icon.png" type="image/x-icon">
    <meta name="view-transition" content="same-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>

    <div class="top">
      <div class="header-nav-top">
        <div class="nav-top-all">
          <div class="nav-top overlay" id="back-btn">
            <span class="material-symbols-rounded">arrow_back_ios_new</span>
          </div>
        </div>
        <div class="header-top-info">
          <h1>Add a Space</h1>
        </div>
      </div>
    </div>

    <div class="ns-content">

      <p class="ns-label">Name your space</p>

      <div class="ns-name-row">
        <div class="ns-emoji-picker"></div>
        <div class="ns-input-pill">
          <input class="ns-input" type="text" placeholder="Space Name" />
        </div>
      </div>

      <hr>

      <p class="ns-label">Edit theme</p>

      <div class="ns-theme-section">
        <div class="ns-canvas-wrapper">
          <canvas id="color-canvas" width="180" height="180"></canvas>
          <div id="color-handle" class="ns-color-handle"></div>
        </div>

        <div class="ns-theme-controls">
          <div class="ns-theme-btn overlay" id="btn-shuffle">
            <span class="material-symbols-rounded">shuffle</span>
          </div>
          <div class="ns-theme-btn overlay" id="btn-light">
            <span class="material-symbols-rounded">light_mode</span>
          </div>
          <div class="ns-theme-btn overlay" id="btn-dark">
            <span class="material-symbols-rounded">dark_mode</span>
          </div>
        </div>
      </div>

    </div>

    <div class="btn overlay" id="create-btn">
      <span class="material-symbols-rounded">add_2</span>
      <p>Create your Space</p>
    </div>

  </body>
  <script src="scripts/script.js"></script>
  <script src="scripts/new-space.js"></script>
</html>
