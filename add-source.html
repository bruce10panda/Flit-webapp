<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add a Source — Flit</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/add-source.css">
    <link rel="icon" href="./assets/icon.png" type="image/x-icon">
    <meta name="view-transition" content="same-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>
    <div class="top">
      <div class="header-nav-top">
        <div class="nav-top-all">
          <div class="nav-top overlay" id="back-btn">
            <span class="material-symbols-rounded">arrow_back_ios_new</span>
          </div>
        </div>
        <div class="header-top-info">
          <h1>Add a Source</h1>
        </div>
      </div>
    </div>

    <div class="source-list">

      <div class="source-section">
        <div class="source-header">
          <div class="source-header-left">
            <span class="material-symbols-rounded source-icon--rss">rss_feed</span>
            <p>RSS Feed</p>
          </div>
          <span class="material-symbols-rounded source-chevron">chevron_right</span>
        </div>
        <div class="source-body">
          <div class="source-input-row">
            <div class="source-input-pill">
              <input class="source-input" type="url" placeholder="https://flit.news/rss" />
            </div>
            <span class="material-symbols-rounded">chevron_right</span>
          </div>
        </div>
      </div>

      <hr>

      <div class="source-section">
        <div class="source-header">
          <div class="source-header-left">
            <span class="source-icon--bluesky"></span>
            <p>Bluesky</p>
          </div>
          <span class="material-symbols-rounded source-chevron">chevron_right</span>
        </div>
        <div class="source-body">
          <div class="source-input-row">
            <div class="source-input-pill">
              <input class="source-input" type="text" placeholder="@flit.news" />
            </div>
            <span class="material-symbols-rounded">chevron_right</span>
          </div>
        </div>
      </div>

    </div>
  </body>
  <script src="scripts/script.js"></script>
  <script src="scripts/add-source.js"></script>
</html>
